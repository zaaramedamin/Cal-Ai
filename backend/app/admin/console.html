<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>CalAi — Admin Review Console</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg-canvas: #0F172A;
    --bg-card: #1E293B;
    --bg-card-hover: #334155;
    --border-card: rgba(255, 255, 255, 0.08);
    --text-primary: #F8FAFC;
    --text-muted: #94A3B8;
    --text-faint: #64748B;
    --accent: #6366F1;
    --accent-hover: #4F46E5;
    --accent-glow: rgba(99, 102, 241, 0.35);
    --positive: #10B981;
    --positive-bg: rgba(16, 185, 129, 0.15);
    --warning: #F59E0B;
    --warning-bg: rgba(245, 158, 11, 0.15);
    --danger: #EF4444;
    --danger-bg: rgba(239, 68, 68, 0.15);
    --radius-lg: 16px;
    --radius-md: 12px;
    --radius-pill: 9999px;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    background: var(--bg-canvas);
    color: var(--text-primary);
    min-height: 100vh;
    line-height: 1.5;
  }

  header {
    display: flex; align-items: center; justify-content: space-between;
    padding: 16px 32px;
    background: rgba(30, 41, 59, 0.85);
    backdrop-filter: blur(12px);
    border-bottom: 1px solid var(--border-card);
    position: sticky; top: 0; z-index: 100;
  }
  header h1 {
    font-size: 18px; font-weight: 800; letter-spacing: -0.5px;
    background: linear-gradient(135deg, #818CF8, #6366F1);
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
  }
  header .who { font-size: 13px; color: var(--text-muted); font-weight: 500; }
  
  main { max-width: 900px; margin: 0 auto; padding: 32px 20px; }

  .tabs { display: flex; gap: 8px; margin-bottom: 24px; background: rgba(30, 41, 59, 0.6); padding: 4px; border-radius: var(--radius-pill); width: fit-content; border: 1px solid var(--border-card); }
  .tabs button {
    font-family: inherit; font-size: 13px; font-weight: 600; border: 0; cursor: pointer;
    padding: 8px 18px; border-radius: var(--radius-pill);
    background: transparent; color: var(--text-muted);
    transition: all 0.2s ease;
  }
  .tabs button:hover { color: var(--text-primary); }
  .tabs button.on { background: var(--accent); color: #fff; box-shadow: 0 4px 14px var(--accent-glow); }
  .tabs .count {
    display: inline-block; margin-left: 6px; padding: 2px 7px;
    border-radius: var(--radius-pill); background: rgba(255,255,255,0.12); font-size: 11px;
  }
  .tabs button.on .count { background: rgba(255,255,255,0.25); }

  .card {
    background: var(--bg-card); border-radius: var(--radius-lg);
    padding: 24px; margin-bottom: 16px; border: 1px solid var(--border-card);
    box-shadow: 0 8px 24px rgba(0,0,0,0.2);
    transition: transform 0.2s ease, opacity 0.2s ease, box-shadow 0.2s ease;
  }
  .card.removing { transform: translateY(-10px) scale(0.98); opacity: 0; }
  .card h2 { font-size: 18px; font-weight: 700; color: #fff; margin-bottom: 4px; }
  .sub { color: var(--text-muted); font-size: 13px; }
  .row { display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; margin-bottom: 16px; }

  .pill {
    display: inline-flex; align-items: center; gap: 6px; padding: 4px 12px; border-radius: var(--radius-pill);
    font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px;
  }
  .pill.plausible { background: var(--positive-bg); color: var(--positive); }
  .pill.suspect   { background: var(--warning-bg); color: var(--warning); }
  .pill.not_food  { background: var(--danger-bg); color: var(--danger); }
  .pill.unscreened{ background: rgba(255,255,255,0.08); color: var(--text-muted); }
  .pill.source    { background: rgba(255,255,255,0.08); color: var(--text-muted); }
  .pill.check     { background: var(--warning-bg); color: var(--warning); }

  .macro-card {
    background: rgba(15, 23, 42, 0.6); border-radius: var(--radius-md);
    padding: 16px; margin: 16px 0; border: 1px solid rgba(255, 255, 255, 0.05);
  }
  table.macros { width: 100%; border-collapse: collapse; font-size: 13px; }
  table.macros td { padding: 4px 12px 4px 0; }
  table.macros td.n { font-variant-numeric: tabular-nums; font-weight: 700; color: #fff; }
  .mismatch { color: var(--danger); font-weight: 700; }
  .agrees { color: var(--positive); font-weight: 600; }

  .quote {
    border-left: 3px solid var(--accent); padding: 10px 14px;
    margin: 14px 0; background: rgba(99, 102, 241, 0.08); border-radius: 0 var(--radius-md) var(--radius-md) 0;
    color: var(--text-primary); font-size: 13px;
  }
  .quote.model { border-left-color: var(--warning); background: rgba(245, 158, 11, 0.08); }
  .quote.system { border-left-color: var(--danger); background: rgba(239, 68, 68, 0.08); }

  label { display: block; font-size: 12px; font-weight: 600; color: var(--text-muted); margin-bottom: 6px; }
  input, select, textarea {
    font-family: inherit; font-size: 13px; width: 100%; padding: 10px 14px;
    border: 1px solid var(--border-card); border-radius: var(--radius-md); background: rgba(15, 23, 42, 0.8);
    color: #fff; outline: none; transition: border-color 0.2s ease;
  }
  input:focus, select:focus, textarea:focus { border-color: var(--accent); }
  textarea { min-height: 70px; resize: vertical; }
  .fields { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 12px; }
  fieldset { border: 1px dashed var(--border-card); border-radius: var(--radius-md); padding: 14px; margin-top: 14px; }
  legend { font-size: 12px; font-weight: 600; color: var(--text-muted); padding: 0 8px; }

  .actions { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 18px; }
  button.act {
    font-family: inherit; font-size: 13px; font-weight: 700; cursor: pointer;
    border: 1px solid var(--border-card); background: rgba(255,255,255,0.08); color: #fff;
    padding: 10px 20px; border-radius: var(--radius-pill); transition: all 0.2s ease;
    display: inline-flex; align-items: center; gap: 6px;
  }
  button.act:hover:not(:disabled) { transform: translateY(-1px); }
  button.act.go { background: var(--positive); border-color: var(--positive); color: #fff; }
  button.act.go:hover:not(:disabled) { box-shadow: 0 4px 14px var(--positive-bg); }
  button.act.no { background: var(--danger); border-color: var(--danger); color: #fff; }
  button.act.no:hover:not(:disabled) { box-shadow: 0 4px 14px var(--danger-bg); }
  button.act:disabled { opacity: 0.45; cursor: not-allowed; transform: none; }

  .empty { color: var(--text-muted); padding: 60px 0; text-align: center; font-size: 15px; }
  .note { color: var(--text-muted); font-size: 12px; margin-top: 6px; }
  .error {
    background: var(--danger-bg); color: #FCA5A5; padding: 12px 16px;
    border-radius: var(--radius-md); font-size: 13px; margin: 12px 0; border: 1px solid rgba(239,68,68,0.3);
  }
  .login { max-width: 380px; margin: 100px auto; }
  .login .card > * + * { margin-top: 14px; }
  .hide { display: none !important; }

  .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 12px; }
  .stat { background: rgba(15, 23, 42, 0.6); border: 1px solid var(--border-card);
          border-radius: var(--radius-md); padding: 14px 16px; }
  .stat b { display: block; font-size: 24px; font-weight: 800; letter-spacing: -0.5px; color: #fff; }
  .stat span { font-size: 12px; color: var(--text-muted); font-weight: 500; }
  .stat.warn b { color: var(--warning); }

  #foodSearch { margin: 16px 0 12px; }
  table.foods { width: 100%; border-collapse: collapse; font-size: 13px; }
  table.foods th { text-align: left; font-size: 11px; text-transform: uppercase;
                   letter-spacing: 0.6px; color: var(--text-faint); padding: 10px 12px;
                   border-bottom: 1px solid var(--border-card); position: sticky; top: 0;
                   background: var(--bg-card); }
  table.foods td { padding: 10px 12px; border-bottom: 1px solid rgba(255,255,255,0.04);
                   vertical-align: middle; }
  table.foods td.n { font-variant-numeric: tabular-nums; text-align: right; color: var(--text-muted); font-weight: 600; }
  .tag { font-size: 11px; padding: 2px 8px; border-radius: var(--radius-pill); background: rgba(255,255,255,0.08);
         color: var(--text-muted); font-weight: 600; }
  .tag.no { background: var(--danger-bg); color: var(--danger); }
  .tag.yes { background: var(--positive-bg); color: var(--positive); }
  .scroller { max-height: 60vh; overflow: auto; border: 1px solid var(--border-card);
              border-radius: var(--radius-md); background: rgba(15, 23, 42, 0.6); }
</style>
</head>
<body>

<header class="hide" id="bar">
  <h1>CalAi Admin Console</h1>
  <div class="spacer"></div>
  <div style="display:flex;align-items:center;gap:16px;">
    <span class="who" id="who"></span>
    <button class="act" id="signout" style="padding:6px 14px;font-size:12px">Sign out</button>
  </div>
</header>

<main>
  <!-- Sign in -->
  <div class="login" id="login">
    <div class="card">
      <h2>Admin Sign In</h2>
      <p class="sub">Sign in with an admin account to manage food submissions, review flags, and manage inventory.</p>
      <div><label for="email">Email</label><input id="email" type="email" placeholder="admin@example.com" autocomplete="username"></div>
      <div><label for="password">Password</label><input id="password" type="password" autocomplete="current-password"></div>
      <div id="loginError"></div>
      <button class="act go" id="signin" style="width:100%;justify-content:center;margin-top:10px;">Sign in</button>
    </div>
  </div>

  <!-- Queues -->
  <div id="app" class="hide">
    <div class="tabs">
      <button data-tab="submissions" class="on">Submissions <span class="count" id="nSubs">0</span></button>
      <button data-tab="reports">Reports <span class="count" id="nReports">0</span></button>
      <button data-tab="notes">Inventory & Notes</button>
    </div>
    <div id="error"></div>
    <div id="list"></div>
  </div>
</main>

<script>
let token = null;
let tab = 'submissions';
let rows = [];
let notes = null;
let config = null;

const $ = (id) => document.getElementById(id);

async function api(path, options = {}) {
  const response = await fetch(path, {
    ...options,
    headers: {
      'Content-Type': 'application/json',
      ...(token ? { Authorization: `Bearer ${token}` } : {}),
      ...(options.headers || {}),
    },
  });
  const text = await response.text();
  const body = text ? JSON.parse(text) : null;
  if (!response.ok) {
    throw new Error(body?.detail || `${response.status} ${response.statusText}`);
  }
  return body;
}

async function fetchToken(email, password) {
  if (config.supabase_url) {
    const response = await fetch(
      `${config.supabase_url.replace(/\/$/, '')}/auth/v1/token?grant_type=password`,
      {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', apikey: config.supabase_anon_key },
        body: JSON.stringify({ email, password }),
      },
    );
    const body = await response.json().catch(() => ({}));
    if (!response.ok) {
      throw new Error(
        body.error_description || body.msg || body.error || `Sign-in failed (${response.status})`,
      );
    }
    return body.access_token;
  }

  const auth = await api('/api/v1/auth/login', {
    method: 'POST',
    body: JSON.stringify({ email, password }),
  });
  return auth.access_token;
}

async function signIn() {
  $('loginError').innerHTML = '';
  $('signin').disabled = true;
  try {
    if (config === null) config = await api('/admin/config');
    token = await fetchToken($('email').value.trim(), $('password').value);
    await api('/api/v1/review/queue?limit=1');

    $('who').textContent = $('email').value.trim();
    $('login').classList.add('hide');
    $('app').classList.remove('hide');
    $('bar').classList.remove('hide');
    $('password').value = '';
    await refresh();
  } catch (err) {
    token = null;
    $('loginError').innerHTML = `<div class="error">${
      err.message === 'Not found.'
        ? 'That account is not an admin.'
        : escapeHtml(err.message)
    }</div>`;
  } finally {
    $('signin').disabled = false;
  }
}

function signOut() {
  token = null;
  rows = [];
  $('app').classList.add('hide');
  $('bar').classList.add('hide');
  $('login').classList.remove('hide');
}

async function refresh() {
  $('error').innerHTML = '';
  try {
    if (tab === 'notes') {
      notes = await api('/api/v1/review/inventory');
      renderNotes();
      return;
    }
    if (tab === 'submissions') {
      rows = await api('/api/v1/review/queue');
      $('nSubs').textContent = rows.length;
    } else {
      const reports = await api('/api/v1/review/reports');
      rows = groupReports(reports);
      $('nReports').textContent = rows.length;
    }
    render();
  } catch (err) {
    $('error').innerHTML = `<div class="error">${escapeHtml(err.message)}</div>`;
  }
}

function groupReports(reports) {
  const byFood = new Map();
  for (const report of reports) {
    const existing = byFood.get(report.food_id);
    if (existing) existing.reports.push(report);
    else byFood.set(report.food_id, { food: report.food, reports: [report] });
  }
  return [...byFood.values()];
}

function render() {
  if (tab === 'notes') return renderNotes();
  if (rows.length === 0) {
    $('list').innerHTML = `<p class="empty">✨ All clear! Nothing waiting in this queue.</p>`;
    return;
  }
  $('list').innerHTML = rows
    .map((row, i) => (tab === 'submissions' ? submissionCard(row, i) : reportCard(row, i)))
    .join('');
}

function macroTable(food) {
  const implied = 4 * food.protein_g + 4 * food.carbs_g + 9 * food.fat_g;
  const off = food.kcal > 0 ? Math.abs(implied - food.kcal) / food.kcal : 0;
  return `
    <div class="macro-card">
      <table class="macros">
        <tr>
          <td>Declared</td><td class="n">${round(food.kcal)} kcal</td>
          <td>Protein</td><td class="n">${round(food.protein_g)} g</td>
          <td>Carbs</td><td class="n">${round(food.carbs_g)} g</td>
          <td>Fat</td><td class="n">${round(food.fat_g)} g</td>
        </tr>
        <tr>
          <td>Macros imply</td>
          <td class="n ${off > 0.1 ? 'mismatch' : 'agrees'}">${round(implied)} kcal</td>
          <td colspan="6" class="${off > 0.1 ? 'mismatch' : 'agrees'}">
            ${off > 0.1 ? `⚠️ ${Math.round(off * 100)}% discrepancy — verify calculation` : '✓ Macro formula matches'}
          </td>
        </tr>
      </table>
    </div>`;
}

function correctionFields(i, food) {
  return `
    <fieldset>
      <legend>Corrections — edit numbers to update and republish</legend>
      <div class="fields">
        <div><label>Name</label><input id="name${i}" value="${escapeAttr(food.name)}"></div>
        <div><label>Brand</label><input id="brand${i}" value="${escapeAttr(food.brand || '')}" placeholder="—"></div>
        <div><label>kcal</label><input id="kcal${i}" type="number" step="0.1" value="${round(food.kcal)}"></div>
        <div><label>Protein g</label><input id="protein_g${i}" type="number" step="0.1" value="${round(food.protein_g)}"></div>
        <div><label>Carbs g</label><input id="carbs_g${i}" type="number" step="0.1" value="${round(food.carbs_g)}"></div>
        <div><label>Fat g</label><input id="fat_g${i}" type="number" step="0.1" value="${round(food.fat_g)}"></div>
      </div>
    </fieldset>`;
}

function submissionCard(item, i) {
  const food = item.food;
  const verdict = item.llm_verdict || 'unscreened';
  return `
    <div class="card" id="card${i}">
      <div class="row">
        <div>
          <h2>${escapeHtml(food.name)}</h2>
          <div class="sub">${escapeHtml(food.brand || 'No brand')} · submitted ${when(item.submitted_at)}</div>
        </div>
        <span class="pill ${verdict}">${verdict.replace('_', ' ')}</span>
      </div>

      ${macroTable(food)}

      ${item.llm_reason
        ? `<div class="quote model"><strong>AI Screening:</strong> ${escapeHtml(item.llm_reason)}</div>`
        : `<div class="note">Not screened.</div>`}

      ${correctionFields(i, food)}

      <div style="margin-top:14px">
        <label for="note${i}">Note to author (required if rejecting)</label>
        <textarea id="note${i}" placeholder="Provide actionable feedback..."></textarea>
      </div>

      <div id="err${i}"></div>
      <div class="actions">
        <button class="act go" onclick="decide(${i}, true)">Approve</button>
        <button class="act no" onclick="decide(${i}, false)">Reject</button>
      </div>
    </div>`;
}

function reportCard(group, i) {
  const food = group.food;
  const filed = group.reports.length;
  const systemOnly = group.reports.every((r) => r.system);
  return `
    <div class="card" id="card${i}">
      <div class="row">
        <div>
          <h2>${escapeHtml(food.name)}</h2>
          <div class="sub">${escapeHtml(food.brand || 'No brand')} · ${systemOnly ? 'flagged at import' : `${filed} report${filed === 1 ? '' : 's'}`}</div>
        </div>
        <span class="pill ${systemOnly ? 'check' : 'source'}">${systemOnly ? 'verify' : escapeHtml(food.source)}</span>
      </div>

      ${macroTable(food)}

      ${group.reports
        .map(
          (r) => `<div class="quote${r.system ? ' system' : ''}"><strong>${
            r.system ? 'Flagged at import' : r.reason.replace(/_/g, ' ')
          }</strong>${r.note ? ` — ${escapeHtml(r.note)}` : ''}<div class="note">${
            r.system ? 'Arithmetic mismatch detected.' : when(r.created_at)
          }</div></div>`,
        )
        .join('')}

      <div style="margin-top:14px">
        <label for="res${i}">Action</label>
        <select id="res${i}" onchange="onResolution(${i}, ${food.correctable})">
          <option value="dismiss">Dismiss — food entry is verified</option>
          <option value="withdrawn">Withdraw — remove from search index</option>
          <option value="corrected"${food.correctable ? '' : ' disabled'}>
            Correct numbers${food.correctable ? '' : ' — not available for ' + escapeAttr(food.source)}
          </option>
        </select>
      </div>

      ${food.correctable ? `<div id="fix${i}" class="hide">${correctionFields(i, food)}</div>` : ''}

      <div style="margin-top:14px">
        <label for="note${i}">Resolution Note</label>
        <textarea id="note${i}" placeholder="Notes for reporters..."></textarea>
      </div>

      <div id="err${i}"></div>
      <div class="actions">
        <button class="act go" onclick="resolve(${i})">Apply Resolution</button>
      </div>
    </div>`;
}

function onResolution(i, correctable) {
  if (!correctable) return;
  $(`fix${i}`).classList.toggle('hide', $(`res${i}`).value !== 'corrected');
}

function renderNotes() {
  if (!notes) return;
  const n = notes;

  const stat = (value, label, warn) =>
    `<div class="stat${warn ? ' warn' : ''}"><b>${value}</b><span>${label}</span></div>`;

  const sources = Object.entries(n.by_source)
    .sort((a, b) => b[1] - a[1])
    .map(([name, count]) => `${escapeHtml(name)}: ${count}`)
    .join(' · ');

  $('list').innerHTML = `
    <div class="card">
      <h2>Food Database Overview</h2>
      <div class="sub" style="margin-bottom:16px">${sources}</div>
      <div class="stats">
        ${stat(n.foods_total, 'Total Foods')}
        ${stat(n.with_photo, 'With Photo')}
        ${stat(n.missing_photo, 'Missing Photo', n.missing_photo > 0)}
        ${stat(n.with_portions, 'With Portions')}
        ${stat(n.missing_portions, 'Grams Only', n.missing_portions > 0)}
      </div>
      <div class="stats" style="margin-top:12px">
        ${stat(n.pending_submissions, 'Submissions Pending', n.pending_submissions > 0)}
        ${stat(n.import_flags, 'Import Flags', n.import_flags > 0)}
        ${stat(n.open_reports, 'Open Reports', n.open_reports > 0)}
      </div>
    </div>

    <div class="card">
      <h2>Portions & Serving Sizes Needed</h2>
      <p class="sub">Items requiring kitchen-scale portion measurements:</p>
      <ul class="note" style="margin:12px 0 0; padding-left:20px; line-height:1.8">
        ${n.portions_wanted.map((w) => `<li>${escapeHtml(w)}</li>`).join('')}
      </ul>
    </div>

    <div class="card">
      <h2>Catalogue Search</h2>
      <p class="sub">${n.foods.length} items loaded into local buffer.</p>
      <input id="foodSearch" placeholder="Search by name, or type: no-photo" oninput="filterFoods()">
      <div class="scroller">
        <table class="foods">
          <thead><tr>
            <th>Name</th><th>French</th><th>Source</th>
            <th style="text-align:right">kcal</th><th>Photo</th><th>Portions</th>
            <th style="text-align:center">Action</th>
          </tr></thead>
          <tbody id="foodRows"></tbody>
        </table>
      </div>
    </div>`;

  filterFoods();
}

function filterFoods() {
  const box = $('foodSearch');
  const term = (box ? box.value : '').trim().toLowerCase();
  const onlyMissingPhoto = term === 'no-photo';
  const text = onlyMissingPhoto ? '' : term;

  const shown = notes.foods.filter((f) => {
    if (onlyMissingPhoto && f.has_photo) return false;
    if (!text) return true;
    return `${f.name} ${f.name_fr || ''}`.toLowerCase().includes(text);
  });

  $('foodRows').innerHTML = shown
    .map(
      (f) => `<tr>
        <td>${escapeHtml(f.name)}${f.withdrawn ? ' <span class="tag no">withdrawn</span>' : ''}</td>
        <td class="sub">${escapeHtml(f.name_fr || '')}</td>
        <td><span class="tag">${escapeHtml(f.source)}</span></td>
        <td class="n">${round(f.kcal)}</td>
        <td><span class="tag ${f.has_photo ? 'yes' : 'no'}">${f.has_photo ? 'yes' : 'none'}</span></td>
        <td class="n">${f.portions || '—'}</td>
        <td style="text-align:center">
          <button class="act" style="padding:4px 10px;font-size:11px" onclick="openInventoryEdit('${f.id}')">Edit & Republish</button>
        </td>
      </tr>
      <tr id="invEdit_${f.id}" class="hide">
        <td colspan="7" style="background:rgba(15,23,42,0.95);padding:16px;border-bottom:1px solid var(--border-card);">
          <div style="font-weight:700;margin-bottom:8px;font-size:13px;color:#fff;">Edit "${escapeHtml(f.name)}" Numbers</div>
          <div class="fields" style="margin-bottom:12px;">
            <div><label>Name</label><input id="inv_name_${f.id}" value="${escapeAttr(f.name)}"></div>
            <div><label>Brand</label><input id="inv_brand_${f.id}" value="${escapeAttr(f.brand || '')}" placeholder="—"></div>
            <div><label>kcal</label><input id="inv_kcal_${f.id}" type="number" step="0.1" value="${round(f.kcal)}"></div>
            <div><label>Protein g</label><input id="inv_protein_g_${f.id}" type="number" step="0.1" value="${round(f.protein_g || 0)}"></div>
            <div><label>Carbs g</label><input id="inv_carbs_g_${f.id}" type="number" step="0.1" value="${round(f.carbs_g || 0)}"></div>
            <div><label>Fat g</label><input id="inv_fat_g_${f.id}" type="number" step="0.1" value="${round(f.fat_g || 0)}"></div>
          </div>
          <div id="inv_err_${f.id}"></div>
          <div class="actions">
            <button class="act go" style="padding:6px 14px;font-size:12px" onclick="saveInventoryEdit('${f.id}')">Save & Republish</button>
            <button class="act" style="padding:6px 14px;font-size:12px" onclick="openInventoryEdit('${f.id}')">Cancel</button>
          </div>
        </td>
      </tr>`,
    )
    .join('') || '<tr><td colspan="7" class="empty">No matching entries found.</td></tr>';
}

function openInventoryEdit(id) {
  const el = $(`invEdit_${id}`);
  if (el) el.classList.toggle('hide');
}

async function saveInventoryEdit(id) {
  const errEl = $(`inv_err_${id}`);
  if (errEl) errEl.innerHTML = '';
  const payload = { republish: true };
  const name = $(`inv_name_${id}`)?.value.trim();
  if (name) payload.name = name;
  const brand = $(`inv_brand_${id}`)?.value.trim();
  if (brand !== undefined) payload.brand = brand || null;

  for (const field of ['kcal', 'protein_g', 'carbs_g', 'fat_g']) {
    const val = $(`inv_${field}_${id}`)?.value.trim();
    if (val !== '' && val !== undefined && !Number.isNaN(Number(val))) {
      payload[field] = Number(val);
    }
  }

  try {
    await api(`/api/v1/review/foods/${id}/edit`, {
      method: 'POST',
      body: JSON.stringify(payload),
    });
    refresh();
  } catch (err) {
    if (errEl) errEl.innerHTML = `<div class="error">${escapeHtml(err.message)}</div>`;
  }
}

function corrections(i) {
  const out = {};
  for (const field of ['name', 'brand']) {
    const value = $(`${field}${i}`)?.value.trim();
    if (value) out[field] = value;
  }
  for (const field of ['kcal', 'protein_g', 'carbs_g', 'fat_g']) {
    const value = $(`${field}${i}`)?.value.trim();
    if (value !== '' && value !== undefined && !Number.isNaN(Number(value))) {
      out[field] = Number(value);
    }
  }
  return out;
}

function removeCardOptimistically(i) {
  const card = $(`card${i}`);
  if (card) {
    card.classList.add('removing');
    setTimeout(() => card.remove(), 200);
  }
}

async function decide(i, approve) {
  const item = rows[i];
  const note = $(`note${i}`)?.value.trim();
  removeCardOptimistically(i);
  try {
    await api(`/api/v1/review/foods/${item.food.id}/decide`, {
      method: 'POST',
      body: JSON.stringify({ approve, note: note || null, ...corrections(i) }),
    });
    refresh();
  } catch (err) {
    $('error').innerHTML = `<div class="error">${escapeHtml(err.message)}</div>`;
    refresh();
  }
}

async function resolve(i) {
  const group = rows[i];
  const choice = $(`res${i}`).value;
  const note = $(`note${i}`).value.trim();
  removeCardOptimistically(i);
  try {
    await api(`/api/v1/review/reports/${group.reports[0].id}/resolve`, {
      method: 'POST',
      body: JSON.stringify({
        accept: choice !== 'dismiss',
        resolution: choice === 'dismiss' ? null : choice,
        note: note || null,
        ...(choice === 'corrected' ? corrections(i) : {}),
      }),
    });
    refresh();
  } catch (err) {
    $('error').innerHTML = `<div class="error">${escapeHtml(err.message)}</div>`;
    refresh();
  }
}

const round = (n) => (Math.round(n * 10) / 10).toLocaleString();

function when(iso) {
  if (!iso) return 'unknown';
  const days = Math.floor((Date.now() - new Date(iso)) / 86400000);
  if (days === 0) return 'today';
  if (days === 1) return 'yesterday';
  return `${days} days ago`;
}

function escapeHtml(value) {
  return String(value).replace(/[&<>"']/g, (c) =>
    ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c],
  );
}
const escapeAttr = escapeHtml;

document.querySelectorAll('.tabs button').forEach((button) => {
  button.onclick = () => {
    document.querySelectorAll('.tabs button').forEach((b) => b.classList.remove('on'));
    button.classList.add('on');
    tab = button.dataset.tab;
    refresh();
  };
});

$('signin').onclick = signIn;
$('signout').onclick = signOut;
$('password').addEventListener('keydown', (e) => e.key === 'Enter' && signIn());
</script>
</body>
</html>
