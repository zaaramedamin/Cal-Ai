[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "calai-backend"
version = "0.1.0"
description = "CalAi backend — calorie and macronutrient tracking API"
requires-python = ">=3.13"

# HTTP clients for USDA/Open Food Facts land in Phase 3. Keeping this list equal
# to what the code actually imports means it stays a truthful description of the
# app rather than a pile of things we might one day use.
dependencies = [
    "fastapi>=0.136",
    "uvicorn[standard]>=0.35",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "pydantic-settings>=2.7",
    # --- Phase 1: auth ---
    # argon2-cffi directly rather than passlib: passlib has been effectively
    # unmaintained since 2020 and its bcrypt backend breaks against modern bcrypt
    # releases. This is the reference implementation from the Argon2 authors.
    "argon2-cffi>=23.1",
    # PyJWT rather than python-jose. python-jose has had unpatched CVEs and
    # carries a much larger surface (JWE, JWK, full JOSE); we sign and verify one
    # token type with one algorithm, and PyJWT does exactly that.
    "pyjwt>=2.10",
    # Backs Pydantic's EmailStr. Validates syntax and normalises the domain.
    "email-validator>=2.2",
    # --- Phase 2: local-day resolution ---
    # Windows ships no system timezone database, so zoneinfo has nothing to read
    # and every lookup silently falls back to UTC. That would put late-evening
    # diary entries on the wrong day, on the platform this is developed on.
    "tzdata>=2025.1",
    # --- Phase 3: nutrition data sources ---
    # Async HTTP for the USDA proxy. Note this is httpx, not the httpx2 in dev
    # dependencies — that one exists solely as Starlette's test transport.
    "httpx>=0.28",
    # --- MongoDB ---
    # The official async driver. `motor` is the asyncio wrapper the MongoDB team
    # maintain over pymongo, so it shares pymongo's BSON codecs and connection
    # pooling rather than reimplementing them.
    "motor>=3.6",
    # Resizes catalogue photos at import time. Worth a dependency: measured on a
    # 4032x3024 phone photo, 6.6 MB becomes 85 KB at 512px — so the full
    # thirty-five-food catalogue is about 3 MB of images instead of 230 MB, for
    # tiles rendered 110pt wide. Decoding and re-encoding also means the bytes
    # served back are ones we generated rather than a file someone handed us.
    "pillow>=11.0",
    # Not a transitive-only dependency: we import ObjectId, IndexModel and the
    # error types directly, and pinning it explicitly means a motor upgrade
    # cannot silently move the version those come from.
    "pymongo>=4.10",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    # Starlette's TestClient transport. httpx2, not httpx: Starlette deprecated
    # the httpx 1.x integration and warns on every test run otherwise.
    "httpx2>=2.9",
    "pytest-cov>=6.0",
    "ruff>=0.9",
]

# Installing the project itself (`pip install -e .`) is what makes `from app...`
# resolve identically for uvicorn, alembic and pytest. The alternative — relying
# on the current working directory being `backend/` — breaks the moment a tool is
# run from anywhere else, and produces import errors that look like typos.
[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
# Each test gets its own event loop. Stated explicitly rather than left to the
# default, because it is the reason the test engine must disable pooling — an
# asyncpg connection belongs to the loop that opened it. See tests/conftest.py.
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.isort]
# `alembic/` is a directory in this project, so import sorting otherwise guesses
# that `alembic` is our own package and files it under first-party — putting it
# in the wrong import block in every migration. It is a third-party library that
# happens to share a name with its own config directory.
known-first-party = ["app"]
known-third-party = ["alembic"]

[tool.ruff.lint.flake8-bugbear]
# B008 bans function calls in argument defaults, because a mutable default is
# evaluated once and then shared across every call — a classic Python trap.
# FastAPI's dependency injection is built on exactly that syntax, and there it is
# intentional and safe: FastAPI inspects the default rather than using it as a
# value. Listing them here keeps the rule protecting us everywhere it should.
extend-immutable-calls = [
    "fastapi.Depends",
    "fastapi.Query",
    "fastapi.Path",
    "fastapi.Body",
    "fastapi.Header",
    "fastapi.Cookie",
    "fastapi.Form",
    "fastapi.File",
    "fastapi.Security",
]
